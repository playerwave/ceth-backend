version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: ceth-redis-container
    ports:
      - "6379:6379"
    networks:
      - ceth-network

  ceth-backend-container:
    build: .
    container_name: ceth-backend-container
    environment:
      - NODE_ENV=development
      - TZ=Asia/Bangkok  # ✅ เพิ่ม timezone setting
      # ใช้ Render database แทน local PostgreSQL
      - DB_HOST=dpg-d2b6p1adbo4c73aia81g-a.singapore-postgres.render.com
      - DB_PORT=5432
      - DB_USERNAME=admin
      - DB_PASSWORD=Wave_310847
      - DB_DATABASE=unizalbuu
    ports:
      - "8069:5090"
    depends_on:
      - redis
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - ceth-network
    command: npm run dev

networks:
  ceth-network:
    driver: bridge

