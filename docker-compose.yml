version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: ceth-postgres-container
    environment:
      POSTGRES_DB: ceth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Bangkok  # ✅ เพิ่ม timezone setting
    ports:
      - "8070:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ceth-network

  redis:
    image: redis:7-alpine
    container_name: ceth-redis-container
    ports:
      - "6379:6379"
    networks:
      - ceth-network

  ceth-backend-container:
    build: .
    container_name: ceth-backend-container
    environment:
      - NODE_ENV=development
      - TZ=Asia/Bangkok  # ✅ เพิ่ม timezone setting
    ports:
      - "8069:5090"
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - ceth-network
    command: npm run dev

volumes:
  postgres_data:

networks:
  ceth-network:
    driver: bridge

