services:
  redis:
    image: redis:7-alpine
    container_name: ceth-redis-container
    restart: unless-stopped
    command: redis-server --requirepass "CethRedis2025!" --protected-mode yes
    volumes:
      - redis_data:/data
    networks:
      - ceth-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:17
    container_name: ceth_postgres_container
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Wave_310847
      POSTGRES_DB: unizalbuu
      TZ: Asia/Bangkok
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d unizalbuu"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ceth-network

  ceth-backend-container:
    build: .
    container_name: ceth-backend-container
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - TZ=Asia/Bangkok
      # Database Configuration
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USERNAME=admin
      - DB_PASSWORD=Wave_310847
      - DB_DATABASE=unizalbuu
      # Redis Configuration
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=CethRedis2025!
      # Server Configuration
      - PORT=5090
      # JWT Configuration
      - JWT_SECRET=your_jwt_secret_here
      - JWT_EXPIRES_IN=24h
    ports:
      - "8069:5090"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ceth-network
    entrypoint: ["sh", "-c"]
    command: ["echo 'Starting...' && npm run build && echo 'Build completed' && ls -la dist/ && echo 'Starting server...' && node dist/server.js"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

networks:
  ceth-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:


